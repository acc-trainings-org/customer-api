openapi: '3.0.3'

info:
  title: Customer API
  version: '1.0'
  contact:
    name: Accenture Training
    email: contact@email.com
    url: http://example.com

servers:
  - url: https://localhost:8080

tags:
  - name: CustomerAPI

paths:
  /customer:
    post:
      description: Create Customer
      summary: create customer for given request
      operationId: createCustomer
      tags:
        - CustomerAPI
      requestBody:
        description: save customer in database
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Customer'

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '500':
          description: Internal Server Error
  /customer/{id}:
    get:
      description: Get Customer
      summary: Fetch customer details for given id
      operationId: getCustomer
      tags:
        - CustomerAPI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad request
        '404':  
          description: Not Found
        '500':
          description: Interal Server Error

components:
  schemas:
    Customer:
      description: This is customer schema/model
      type: object
      required:
        - customerId
      properties:
        customerId:
          type: string
          description: unique ID of the customer
          example: 12345
          minLength: 5
          maxLength: 8
        customerName:
          type: string
          description: firstName and lastName of the customer
          example: Rahul Anand
        customerAddress:
          type: string
          example: Hartford, USA
        officeCode:
          type: integer
          example: 045